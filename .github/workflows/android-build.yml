name: Android Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        default: v0.1.0
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test and export debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7
    env:
      GODOT_VERSION: "4.7"
      RELEASE_TAG: ${{ inputs.tag }}
      APK_PATH: build/android/gogogo-android-arm64-debug.apk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          sed -i -E "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          sed -i -E "s|^version/name=.*|version/name=\"${release_version}\"|" export_presets.cfg

      - name: Prepare Android export environment
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends fontconfig
          rm -rf /var/lib/apt/lists/*

          template_source="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          template_target="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          settings_source="/root/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          settings_target="${HOME}/.config/godot/editor_settings-${GODOT_VERSION}.tres"

          test -d "${template_source}"
          mkdir -p "$(dirname "${template_target}")"
          cp -R "${template_source}" "${template_target}"

          test -f "${settings_source}"
          mkdir -p "$(dirname "${settings_target}")"
          cp "${settings_source}" "${settings_target}"

          test -x "${JAVA_HOME}/bin/java"
          test -d "${ANDROID_HOME}/build-tools/33.0.2"
          test -d "${ANDROID_HOME}/platforms/android-33"
          test -e /usr/lib/x86_64-linux-gnu/libfontconfig.so.1
          grep -F 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' "${settings_target}"
          grep -F 'export/android/android_sdk_path = "/usr/lib/android-sdk"' "${settings_target}"

      - name: Import project and check scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --xr-mode off --path . --editor --quit
          godot --headless --xr-mode off --path . --check-only --quit

      - name: Run core regression tests
        shell: bash
        run: godot --headless --xr-mode off --path . --script res://tests/test_runner.gd

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${APK_PATH}")"
          godot --headless --path . --export-debug Android "${APK_PATH}"
          test -s "${APK_PATH}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: GoGoGo ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.APK_PATH }}
